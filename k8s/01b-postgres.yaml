apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracelytag-postgres
  namespace: tracelytag
  labels:
    app: tracelytag-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tracelytag-postgres
  template:
    metadata:
      labels:
        app: tracelytag-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "tracelytag"
            - name: POSTGRES_USER
              value: "tracelytag"
            - name: POSTGRES_PASSWORD
              value: "tracelytag_secret_2026"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pg-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tracelytag-postgres-svc
  namespace: tracelytag
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: tracelytag-postgres
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: tracelytag
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: tracelytag-postgres
  type: ClusterIP
