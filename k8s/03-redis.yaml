apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracelytag-redis
  namespace: tracelytag
  labels:
    app: tracelytag-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracelytag-redis
  template:
    metadata:
      labels:
        app: tracelytag-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tracelytag-redis-svc
  namespace: tracelytag
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: tracelytag-redis
  type: ClusterIP
