apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracelytag-backend
  namespace: tracelytag
  labels:
    app: tracelytag-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tracelytag-backend
  template:
    metadata:
      labels:
        app: tracelytag-backend
    spec:
      containers:
        - name: backend
          image: luphonixprime/tracly-tag-final-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: tracelytag-config
            - secretRef:
                name: tracelytag-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: tracelytag-backend-svc
  namespace: tracelytag
  labels:
    app: tracelytag-backend
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: tracelytag-backend
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tracelytag
  labels:
    app: tracelytag-backend
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: tracelytag-backend
  type: ClusterIP
