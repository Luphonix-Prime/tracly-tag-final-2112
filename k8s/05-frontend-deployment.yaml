apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracelytag-frontend
  namespace: tracelytag
  labels:
    app: tracelytag-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tracelytag-frontend
  template:
    metadata:
      labels:
        app: tracelytag-frontend
    spec:
      containers:
        - name: frontend
          image: luphonixprime/tracly-tag-final-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tracelytag-frontend-svc
  namespace: tracelytag
  labels:
    app: tracelytag-frontend
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 8080
      targetPort: 80
      name: http-alt
  selector:
    app: tracelytag-frontend
  type: LoadBalancer
